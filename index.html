<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私密留言板</title>
  <!-- Supabase 客户端库 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      color: #333;
      line-height: 1.7;
      padding: 20px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 30px 0 20px;
      border-bottom: 2px solid #e8eaf0;
      margin-bottom: 24px;
    }
    header h1 { font-size: 26px; color: #4f46e5; }
    header p { color: #7f8c9b; font-size: 14px; margin-top: 6px; }

    .app-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .app-link:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45); }
    .app-link:active { transform: translateY(0); }
    .app-link .arrow { font-size: 14px; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card h2 { font-size: 18px; color: #2c3e50; margin-bottom: 14px; }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 12px;
      font-family: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    input:focus, textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }

    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 15px;
      cursor: pointer;
    }
    button:active { background: #3730a3; }
    button.secondary {
      background: #e5e7eb;
      color: #374151;
    }
    button.secondary:active { background: #d1d5db; }
    button.danger {
      background: #ef4444;
    }
    button.danger:active { background: #dc2626; }

    .msg-item {
      background: #f9fafb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #4f46e5;
    }
    .msg-item .meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }
    .msg-item .content {
      color: #1f2937;
      margin-bottom: 10px;
    }
    .msg-item .reply {
      background: #eef2ff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #4338ca;
      margin-top: 8px;
    }
    .msg-item .reply-label {
      font-size: 12px;
      color: #6366f1;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      padding: 8px 18px;
      border-radius: 20px;
      background: #e5e7eb;
      color: #374151;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }
    .tab.active {
      background: #4f46e5;
      color: #fff;
    }

    .admin-bar {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #991b1b;
    }
    .admin-bar input {
      margin: 0;
      padding: 6px 10px;
      font-size: 14px;
      width: auto;
    }

    .empty { text-align: center; color: #9ca3af; padding: 30px; }
    .error { color: #dc2626; font-size: 14px; margin-top: 8px; }
    .success { color: #059669; font-size: 14px; margin-top: 8px; }

    .reply-box {
      margin-top: 10px;
      display: none;
    }
    .reply-box textarea {
      min-height: 60px;
      margin-bottom: 8px;
    }

    footer {
      text-align: center;
      color: #a0a8b8;
      font-size: 13px;
      padding: 20px 0 8px;
    }

    .setup-note {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      color: #92400e;
      margin-bottom: 16px;
    }
    .setup-note code {
      background: #fef3c7;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>私密留言板</h1>
      <p>只有你和博主能看到 · 换浏览器或清缓存会丢失历史记录</p>
      <a class="app-link" href="drama-maker.html">🎬 Ai短剧制作工具app <span class="arrow">→</span></a>
    </header>

    <!-- 配置提示（首次使用显示） -->
    <div class="setup-note" id="setupNote">
      <strong>Supabase 数据库已配置</strong> — 如果页面显示正常，可以直接使用。<br>
      如果看到"配置提示"没有消失，请检查 SQL 建表语句是否已执行（见代码底部注释）。
    </div>

    <!-- 标签切换 -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('guest')" id="tabGuest">我要留言</button>
      <button class="tab" onclick="switchTab('admin')" id="tabAdmin">管理员入口</button>
    </div>

    <!-- 访客视图 -->
    <div id="guestView">
      <div class="card">
        <h2>写留言</h2>
        <input type="text" id="guestName" placeholder="你的昵称（必填）" maxlength="30">
        <textarea id="guestContent" placeholder="写点什么...（必填）" maxlength="500"></textarea>
        <button onclick="submitMessage()">提交留言</button>
        <div id="guestMsg"></div>
      </div>

      <div class="card">
        <h2>我的留言记录</h2>
        <div id="myMessages">
          <div class="empty">加载中...</div>
        </div>
      </div>
    </div>

    <!-- 管理员视图 -->
    <div id="adminView" style="display:none;">
      <div class="card">
        <h2>管理员登录</h2>
        <input type="password" id="adminPwd" placeholder="输入管理密码">
        <button onclick="adminLogin()">登录</button>
        <div id="adminLoginMsg"></div>
      </div>

      <div id="adminPanel" style="display:none;">
        <div class="admin-bar">
          管理员模式：显示所有留言。点击「回复」进行回复。
        </div>
        <div class="card">
          <h2>所有留言</h2>
          <div id="allMessages">
            <div class="empty">加载中...</div>
          </div>
        </div>
      </div>
    </div>

    <footer>© 2026 私密留言板 · 使用 Supabase 免费数据库</footer>
  </div>

  <script>
    // ==================== 配置区（必须修改） ====================
    // 去 supabase.com 注册后，在项目 Settings → API 里找到这两个值：
    const SUPABASE_URL = 'https://dnqswjrevffwdcksnwan.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_O23O8vd8DYWDBoydPjl9LA_uYGspSHC';
    // ==========================================================

    // 管理密码（你可以改成自己的）
    const ADMIN_PASSWORD = 'admin123';

    // 生成或读取访客唯一标识
    function getVisitorId() {
      let vid = localStorage.getItem('guestbook_vid');
      if (!vid) {
        vid = 'v_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        localStorage.setItem('guestbook_vid', vid);
      }
      return vid;
    }

    // 初始化 Supabase
    let supabase = null;
    let isAdmin = false;

    function initSupabase() {
      if (SUPABASE_URL.indexOf('你的项目ID') !== -1) {
        document.getElementById('setupNote').style.display = 'block';
        return false;
      }
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        document.getElementById('setupNote').style.display = 'none';
        return true;
      } catch (e) {
        showMsg('guestMsg', 'Supabase 初始化失败：' + e.message, 'error');
        return false;
      }
    }

    // 显示消息
    function showMsg(elId, text, type) {
      const el = document.getElementById(elId);
      el.textContent = text;
      el.className = type === 'error' ? 'error' : 'success';
    }

    // 切换标签
    function switchTab(tab) {
      if (tab === 'guest') {
        document.getElementById('guestView').style.display = 'block';
        document.getElementById('adminView').style.display = 'none';
        document.getElementById('tabGuest').classList.add('active');
        document.getElementById('tabAdmin').classList.remove('active');
        if (supabase) loadMyMessages();
      } else {
        document.getElementById('guestView').style.display = 'none';
        document.getElementById('adminView').style.display = 'block';
        document.getElementById('tabAdmin').classList.add('active');
        document.getElementById('tabGuest').classList.remove('active');
      }
    }

    // 提交留言
    async function submitMessage() {
      if (!supabase) { showMsg('guestMsg', '请先配置 Supabase（见页面上方提示）', 'error'); return; }
      const name = document.getElementById('guestName').value.trim();
      const content = document.getElementById('guestContent').value.trim();
      if (!name || !content) { showMsg('guestMsg', '昵称和留言内容都不能为空', 'error'); return; }

      const { error } = await supabase.from('messages').insert([{
        visitor_id: getVisitorId(),
        name: name,
        content: content,
        reply: ''
      }]);

      if (error) {
        showMsg('guestMsg', '提交失败：' + error.message, 'error');
      } else {
        showMsg('guestMsg', '留言成功！', 'success');
        document.getElementById('guestContent').value = '';
        loadMyMessages();
      }
    }

    // 加载我的留言
    async function loadMyMessages() {
      if (!supabase) return;
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .eq('visitor_id', getVisitorId())
        .order('created_at', { ascending: false });

      const el = document.getElementById('myMessages');
      if (error) { el.innerHTML = '<div class="error">加载失败：' + error.message + '</div>'; return; }
      if (!data || data.length === 0) { el.innerHTML = '<div class="empty">暂无留言，写一条吧</div>'; return; }

      el.innerHTML = data.map(m => `
        <div class="msg-item">
          <div class="meta">${m.name} · ${m.created_at ? m.created_at.slice(0,10) : '刚刚'}</div>
          <div class="content">${escapeHtml(m.content)}</div>
          ${m.reply ? `<div class="reply"><div class="reply-label">博主回复</div>${escapeHtml(m.reply)}</div>` : ''}
        </div>
      `).join('');
    }

    // 管理员登录
    function adminLogin() {
      const pwd = document.getElementById('adminPwd').value;
      if (pwd === ADMIN_PASSWORD) {
        isAdmin = true;
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('adminLoginMsg').textContent = '';
        if (supabase) loadAllMessages();
      } else {
        showMsg('adminLoginMsg', '密码错误', 'error');
      }
    }

    // 加载所有留言（管理员）
    async function loadAllMessages() {
      if (!supabase) return;
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: false });

      const el = document.getElementById('allMessages');
      if (error) { el.innerHTML = '<div class="error">加载失败：' + error.message + '</div>'; return; }
      if (!data || data.length === 0) { el.innerHTML = '<div class="empty">暂无留言</div>'; return; }

      el.innerHTML = data.map((m, idx) => `
        <div class="msg-item">
          <div class="meta">${m.name} · ${m.created_at ? m.created_at.slice(0,10) : '刚刚'}</div>
          <div class="content">${escapeHtml(m.content)}</div>
          ${m.reply ? `<div class="reply"><div class="reply-label">回复</div>${escapeHtml(m.reply)}</div>` : ''}
          <div style="margin-top:10px;">
            <button class="secondary" onclick="toggleReply(${idx}, ${m.id})">回复</button>
          </div>
          <div class="reply-box" id="replyBox_${idx}">
            <textarea id="replyText_${idx}" placeholder="输入回复...">${m.reply || ''}</textarea>
            <button onclick="saveReply(${m.id}, ${idx})">保存回复</button>
          </div>
        </div>
      `).join('');
    }

    // 切换回复框
    function toggleReply(idx, id) {
      const box = document.getElementById('replyBox_' + idx);
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    // 保存回复
    async function saveReply(id, idx) {
      if (!supabase) return;
      const text = document.getElementById('replyText_' + idx).value.trim();
      const { error } = await supabase.from('messages').update({ reply: text }).eq('id', id);
      if (error) {
        alert('保存失败：' + error.message);
      } else {
        alert('回复已保存');
        loadAllMessages();
      }
    }

    // HTML 转义防止 XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 页面加载时初始化
    window.onload = function() {
      if (initSupabase()) {
        loadMyMessages();
      }
    };
  </script>

  <!-- 建表 SQL（复制到 Supabase SQL Editor 执行） -->
  <!--
  CREATE TABLE messages (
    id SERIAL PRIMARY KEY,
    visitor_id TEXT NOT NULL,
    name TEXT NOT NULL,
    content TEXT NOT NULL,
    reply TEXT DEFAULT '',
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
  );

  -- 允许匿名插入（Row Level Security 关闭或配置为公开插入）
  ALTER TABLE messages ENABLE ROW LEVEL SECURITY;
  CREATE POLICY "allow_all_insert" ON messages FOR INSERT WITH CHECK (true);
  CREATE POLICY "allow_all_select" ON messages FOR SELECT USING (true);
  CREATE POLICY "allow_all_update" ON messages FOR UPDATE USING (true);
  -- 注意：上面的策略允许任何人读写，安全性依赖前端 visitor_id 过滤。
  -- 对于私密留言板，这是纯前端方案下的折中做法。
  -- 生产环境建议配合 Auth 使用。
  -->
</body>
</html>
